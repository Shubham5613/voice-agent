# Pings the hosted demo backend every 5 minutes so the free Render instance
# never spins down (a cold start adds ~40 s to the first visit and can time out
# the agent's first tool call). Delete this file when the demo is over.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -o /dev/null -m 60 -w "%{http_code}\n" https://aanya-voice-agent-x0q5.onrender.com/
